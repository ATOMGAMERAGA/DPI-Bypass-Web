server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Traefik/Dokploy arkasında gerçek istemci IP'si
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # Sıkıştırma
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/xml;

    # Güvenlik başlıkları
    add_header X-Content-Type-Options   "nosniff"                  always;
    add_header X-Frame-Options          "SAMEORIGIN"               always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    server_tokens off;

    # HTML, sitemap ve robots her dağıtımda yeniden doğrulanır.
    etag on;
    add_header Cache-Control "no-cache" always;

    # HTML'de içerik hash'i olan sorgu parametreleri eski CSS/JS'yi önler.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Erişim kaydında sağlık kontrollerini gösterme
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
